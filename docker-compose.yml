version: '3.8'

services:
  # Serviço da API Flask com Gunicorn
  api:
    build: .
    container_name: ponto_api
    restart: unless-stopped
    env_file:
      - .env  # Arquivo para variáveis de ambiente (ex: API keys)
    volumes:
      - ./logs:/app/logs
    networks:
      - ponto-network
    expose:
      - "5231"

  # Nginx como Reverse Proxy
  nginx:
    image: nginx:1.21-alpine
    container_name: ponto_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - ponto-network

networks:
  ponto-network:
    driver: bridge

volumes:
  logs:
